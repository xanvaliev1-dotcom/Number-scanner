name: Build NumberScanner APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NumberScanner_project-3.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q NumberScanner_project-3.zip -d .

      - name: Build APK
        run: gradle -p NumberScanner assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NumberScanner-APK
          path: NumberScanner/app/build/outputs/apk/debug/*.apk
